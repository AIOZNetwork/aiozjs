syntax = "proto3";
package aioz.staking.v1beta1;

import "gogoproto/gogo.proto";

import "cosmos_proto/cosmos.proto";
import "cosmos/staking/v1beta1/tx.proto";
import "aioz/staking/v1beta1/staking.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";

option go_package = "github.com/AIOZNetwork/go-aioz/x/staking/types";

// Msg defines the staking Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc ProposeValidator(MsgProposeValidator) returns (MsgProposeValidatorResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
//
// Since: aioz 1.5
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name)           = "aioz/x/staking/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the x/mint parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
//
// Since: aioz 1.5
message MsgUpdateParamsResponse {}

// MsgProposeValidator
//
// Since: aioz 1.5
message MsgProposeValidator {
  option (cosmos.msg.v1.signer)      = "authority";
  option (amino.name)                = "aioz/MsgProposeValidator";
  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  cosmos.staking.v1beta1.MsgCreateValidator validator = 2
      [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgProposeValidatorResponse
//
// Since: aioz 1.5
message MsgProposeValidatorResponse {};