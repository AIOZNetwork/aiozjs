syntax = "proto3";
package aioz.burn.v1;

option go_package = "github.com/AIOZNetwork/go-aioz/x/burn/types";

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "aioz/cron/v1/cron.proto";

// Params holds parameters for the burn module.
message Params {
  option (gogoproto.goproto_stringer) = false;

  string tx_fees_burn_rate = 1 [
    (cosmos_proto.scalar)  = "cosmos.Dec",
    (gogoproto.customtype) = "github.com/cosmos/cosmos-sdk/types.Dec",
    (gogoproto.nullable)   = false
  ];

  string tx_fees_burn_account = 2;
}

// BurnAccount defines cron schedule for the burn account.
message BurnAccount {
  option (gogoproto.goproto_getters)  = false;
  option (gogoproto.goproto_stringer) = false;

  option (cosmos_proto.implements_interface) = "github.com/AIOZNetwork/go-aioz/x/cron/types.EntryI";

  aioz.cron.v1.BaseEntry base_entry = 1 [(gogoproto.embed) = true];
}